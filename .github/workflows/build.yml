name: Build Fluxie

# Builds installable APKs for both editions on every push / pull request, and on demand
# (Actions tab > "Build Fluxie" > Run workflow). Download them from the run's "Artifacts".
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (full + lite)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-37" > /dev/null

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleFullDebug assembleLiteDebug --stacktrace

      - name: Show APK sizes
        run: |
          ls -l app/build/outputs/apk/full/debug/*.apk app/build/outputs/apk/lite/debug/*.apk
          {
            echo "### APK sizes (debug, bytes)"
            for f in app/build/outputs/apk/full/debug/*.apk app/build/outputs/apk/lite/debug/*.apk; do
              echo "- \`$(basename "$f")\`: $(stat -c %s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Fluxie (full) APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluxie-full-debug
          path: app/build/outputs/apk/full/debug/*.apk

      - name: Upload Fluxie Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: Fluxie-lite-debug
          path: app/build/outputs/apk/lite/debug/*.apk

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses and install build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platforms;android-37" > /dev/null

      - name: Run unit tests (both editions)
        run: |
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest testLiteDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
